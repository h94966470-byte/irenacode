<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>irenacode</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
      color: white;
    }

    .box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 32px 48px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="box" id="message">ĐỊT MẸ MÀY</div>
  <div class="box" id="message2">CHAN BỐ MÀY ĐÊ</div>

  <script>
    const message = "ĐỊT MẸ MÀY";
    const message2 = "CHAN BỐ MÀY ĐÊ";
    console.log(message);
    console.log(message2);
    document.getElementById("message").textContent = message;
    document.getElementById("message2").textContent = message2;
  </script>
</body>
</html>
